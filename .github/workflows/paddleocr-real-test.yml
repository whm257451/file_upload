name: PaddleOCR real image test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned PaddleOCR environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            paddlepaddle==2.6.2 \
            paddleocr==2.7.3 \
            numpy==1.26.4 \
            opencv-python-headless==4.9.0.80
          python -m pip freeze | sort > requirements-lock.txt
          python - <<'PY'
          import cv2, numpy, paddle, paddleocr
          print('paddle=', paddle.__version__)
          print('paddleocr=', getattr(paddleocr, '__version__', 'unknown'))
          print('opencv=', cv2.__version__)
          print('numpy=', numpy.__version__)
          PY
      - name: Download the two original samples
        run: |
          mkdir -p inputs
          curl --fail --location --retry 5 \
            'http://s3-cn-sh2.ufileos.com/zn-zuoye/2026/08/03/f3227eb81a9d4d54bffeec1b12bf3c8f.jpg' \
            -o inputs/handwriting_1.jpg
          curl --fail --location --retry 5 \
            'http://s3-cn-sh2.ufileos.com/zn-zuoye/2026/08/03/4a5875abcfab4e8da156fce2b10b5c39.jpg' \
            -o inputs/handwriting_2.jpg
          sha256sum inputs/*.jpg > input-sha256.txt
      - name: Run real PaddleOCR inference
        env:
          FLAGS_use_mkldnn: '0'
          OMP_NUM_THREADS: '1'
        run: |
          python paddleocr_v2_handwriting.py \
            inputs/handwriting_1.jpg inputs/handwriting_2.jpg \
            --output-dir real_results \
            --tile-size 1400 \
            --overlap 160 \
            --min-confidence 0.30 \
            --handwriting-threshold 0.38 \
            2>&1 | tee inference.log
          sha256sum real_results/* > output-sha256.txt
      - name: Upload real results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-v2-real-results
          path: |
            real_results/
            paddleocr_v2_handwriting.py
            requirements-lock.txt
            input-sha256.txt
            output-sha256.txt
            inference.log
          if-no-files-found: warn
          retention-days: 7
